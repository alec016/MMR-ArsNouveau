plugins {
  id 'java-library'
  id 'idea'
  id 'maven-publish'
  id 'net.neoforged.moddev' version '2.0.105'
  id "es.degrassi.unified-publishing-with-mmr-bot" version "1+"
  id "io.freefair.lombok" version "8.6"
}

tasks.named('wrapper', Wrapper).configure {
  distributionType = Wrapper.DistributionType.BIN
}

base {
  archivesName = archives_base_name
  version = "${minecraft_version}-${mod_version}"
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)
java.withSourcesJar()

tasks.processResources {
  duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

neoForge {
  version = project.neo_version

  parchment {
    mappingsVersion = project.parchment_mappings_version
    minecraftVersion = project.parchment_minecraft_version
  }

  accessTransformers.from project.files('src/main/resources/META-INF/accesstransformer.cfg')
  runs {
    client {
      client()
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    server {
      server()
      programArgument "--nogui"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    gameTestServer {
      type = "gameTestServer"
      systemProperty "neoforge.enabledGameTestNamespaces", project.mod_id
    }
    data {
      data()
      programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
    configureEach {
      systemProperty 'forge.logging.markers', 'REGISTRIES'
      logLevel = org.slf4j.event.Level.DEBUG
    }
  }

  mods {
    "${mod_id}" {
      sourceSet(sourceSets.main)
    }
  }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

configurations {
  runtimeClasspath.extendsFrom localRuntime
  libraries
  // This will make sure that all dependencies that you add to the libraries configuration will also be added to the implementation configuration
  // This way, you only need one dependency declaration for both runtime and compile dependencies
  implementation.extendsFrom libraries
}

repositories {
  mavenLocal()
  mavenCentral()
  maven {
    url = "https://repo.spongepowered.org/repository/maven-public/"
  }
  maven {
    name = "Forge"
    url = "https://maven.minecraftforge.net"
  }
  maven {
    name = "Jared's maven"
    url = "https://maven.blamejared.com/"
  }
  maven {
    name = "Shedaniel's maven"
    url = "https://maven.shedaniel.me/"
  }
  maven {
    name = "Illusive Soulworks maven"
    url = "https://maven.theillusivec4.top/"
  }
  maven {
    name = "Lat's maven"
    url = "https://maven.latvian.dev/releases"
  }
  //Needed for KubeJS
  maven {
    url 'https://jitpack.io'
  }
  maven {
    url = "https://maven.architectury.dev"
  }
  maven {
    name = "Mod maven"
    url = "https://modmaven.dev/"
  }
  maven {
    name = "CurseForge"
    url "https://www.cursemaven.com"
  }
  maven {
    name = "OctoStudios"
    url = uri("https://maven.octo-studios.com/releases")
  }
  maven { // TOP
    url "https://maven.k-4u.nl"
  }
  maven {
