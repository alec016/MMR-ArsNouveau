dependencies {
  // lombok
  compileOnly "org.projectlombok:lombok:${project.lombok_version}"
  annotationProcessor "org.projectlombok:lombok:${project.lombok_version}"
  implementation "net.neoforged:neoforge:${neo_version}"
  implementation ("io.github.llamalad7:mixinextras-neoforge:0.4.1")
  compileOnly localRuntime("es.degrassi:modular_machinery_reborn:${minecraft_version}-${mmr_version}")
  compileOnly localRuntime("es.degrassi:experiencelib:${minecraft_version}-${experiencelib_version}")

  // ProbeJS
  localRuntime("curse.maven:probejs-585406:7105159")

  // JEI
  compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
  compileOnly localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")

  // EMI
  compileOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}:api")
  compileOnly runtimeOnly("dev.emi:emi-neoforge:${emi_version}+${minecraft_version}")

  // KubeJS
  localRuntime compileOnly("dev.latvian.mods:kubejs-neoforge:${kubejs_version}")

  // Jade
  localRuntime compileOnly("curse.maven:jade-324717:${jade_version}")

  // ARS
  localRuntime ("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
  localRuntime compileOnly ("com.hollingsworth.nuggets:nuggets-neoforge-1.21:${project.nuggets_version}")
  localRuntime ("vazkii.patchouli:Patchouli:1.21.1-${project.patchouli_version}")
  localRuntime "top.theillusivec4.curios:curios-neoforge:${project.curios_version}"
  localRuntime compileOnly ("com.hollingsworth.ars_nouveau:ars_nouveau-${project.minecraft_version}:${project.ars_version}.1280")

  // Athena
  compileOnly localRuntime("earth.terrarium.athena:athena-neoforge-1.21:${athena_version}")

  // Mekanism
  localRuntime("mekanism:Mekanism:${mekanism_version}")
}


var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
  var replaceProperties = [
      minecraft_version      : minecraft_version,
      minecraft_version_range: minecraft_version_range,
      neo_version            : neo_version,
      neo_version_range      : neo_version_range,
      loader_version_range   : loader_version_range,
      mod_id                 : mod_id,
      mod_name               : mod_name,
      mod_license            : mod_license,
      mod_version            : mod_version,
      mod_authors            : mod_authors,
      mod_description        : mod_description,
      mod_url                : mod_url,
      icon                   : icon,
      pack_format_number     : pack_format_number,
      ars_version            : ars_version,
      jei_version            : jei_version,
      emi_version            : emi_version,
      kubejs_version         : kubejs_version,
      mmr_version            : mmr_version,
      athena_version         : athena_version,
  ]
  inputs.properties replaceProperties
  expand replaceProperties
  from "src/main/templates"
  into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
  publications {
    register('mavenJava', MavenPublication) {
      groupId = maven_group
      artifactId = archivesBaseName
      version = project.version
      from components.java

      pom {
        name = mod_name
        description = mod_description
        packaging = 'jar'
        scm {
          url = mod_github
        }
        issueManagement {
          system = 'github'
          url = mod_issues
        }
        licenses {
          license {
            name = mod_license
            distribution = 'repo'
          }
        }
        developers {
          developer {
            id = mod_authors
            name = mod_authors
            roles = ['developper']
          }
        }
      }
    }
  }
  repositories {
    maven {
      name = 'maven'
      url = 'https://maven.degrassi.es/releases'
      credentials {
        username = "Alec_016GG"
        password = System.getenv("MAVEN_PASSWORD")
      }
    }
  }
}

tasks.withType(JavaCompile).configureEach {
  options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
  module {
    downloadSources = true
    downloadJavadoc = true
  }
}

unifiedPublishingWithMMRBot {
  project {
    displayName = "[NeoForge]ModularMachineyRebornArsNouveau-${minecraft_version}-${mod_version}"
    releaseType = "release"
    if(rootProject.file("CHANGELOG.md").exists()) {
      changelog = rootProject.file("CHANGELOG.md").text
    }
    gameVersions = ["${minecraft_version}", "1.21"]
    gameLoaders = ["neoforge"]
    mainPublication jar
    modid = mod_id
    modVersion = "ModularMachineyRebornArs-${minecraft_version}-${mod_version}"

    var CURSE_API_KEY = System.getenv("CURSEFORGE")
    if (CURSE_API_KEY != null) {
        curseforge {
            token = CURSE_API_KEY
            id = "1132269"
            relations {
                depends "modular-machinery-reborn"
                depends "ars-nouveau"
                depends "athena"
                optional "kubejs"
                optional "jei"
                optional "emi"
            }
        }
    }

    var MODRINTH_API_KEY = System.getenv("MODRINTH")
    if (MODRINTH_API_KEY != null) {
      modrinth {
        token = MODRINTH_API_KEY
        id = "C8tO5HS1"
        relations {
          depends "ars-nouveau"
          depends "modular-machinery-reborn"
          depends "athena"
          optional "kubejs"
          optional "jei"
          optional "emi"
          optional "jade"
        }
      }
    }
  }
}
